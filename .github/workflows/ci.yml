name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "docs/ledger/**"
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the desk's own tools
        run: python -m pytest tests -q

      - name: Published run is clean and the ledger chains verify
        run: python run.py --assert-clean
